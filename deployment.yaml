apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-world

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-world

  template:
    metadata:
      labels:
        app: hello-world

    spec:
      containers:
        - name: hello-world
          image: za1xht0/hello-world-devops:latest
          ports:
            - containerPort: 32777
